    <style>

        }

        html,
        body {
            width: 100%;
            height: 100%;

        }

        .box {
            position: absolute;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) .5s;
            height: 300px;
            width: 300px;
            background-color: red;
            cursor: pointer;
        }
    </style>
